<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      const path = window.location.pathname.replace('/page', '');
      window.location.replace(
        window.location.origin + '/page/?redirect=' + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
